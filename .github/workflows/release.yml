name: Publish signed desktop release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pi-agent-desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            apple_signing_identity: "-"
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb
            apple_signing_identity: ""
          # Restored after the file-tracer fix in eacaca3/7f2a1c0: a literal
          # homedir() reaching an fs call made @vercel/nft glob the whole
          # Windows profile at build time, which failed on its junction loops.
          # Verified through desktop:prepare by windows-build-debug.yml before
          # re-enabling; Tauri bundling and signing are first exercised here.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
            apple_signing_identity: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Require updater signing secrets
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$UPDATER_PRIVATE_KEY"
          test -n "$UPDATER_PUBLIC_KEY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/configure-updater-public-key.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled component releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run release:manifest
          npm run release:verify

      - name: Prepare packaged Next.js server
        run: npm run desktop:prepare

      - name: Test desktop shell
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}

      - name: Build, sign, and upload updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PI_AGENT_DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        with:
          tagName: v__VERSION__
          releaseName: pi-agent-desktop v__VERSION__
          releaseBody: |
            ## Pi Agent Desktop 0.7.0

            Artifacts, inline previews and side-panel release.

            ### Added

            - **Projects / Recent switch** in the sidebar header: two small buttons toggle between the project tree and one flat list of every project's sessions, newest first. The choice is remembered.
            - **New sessions name themselves**: after the first reply a session gets a title automatically. Sessions you reopen are never renamed.
            - **More in the session right-click menu**: Generate title, Copy session ID and Full history work on any session in the list.
            - **Artifacts in the side panel**: the assistant can put a standalone page, app, React component, SVG, Mermaid diagram or long document in its own panel tab, with versions, Preview / Source, copy and download. Asking for a change produces a new version in place. Turn the prompt hint off in Settings → General → **Artifacts in the side panel**.
            - **Inline previews**: complete ```` ```html ```` pages and ```` ```svg ```` images in replies render in place, with a full-screen view. React (`jsx` / `tsx`) components run on request with the bundled React and Tailwind, offline unless they import npm packages. A preview that throws shows its errors with **Ask to fix**.
            - **Edited files card** under a reply: every file the turn wrote, with lines added and removed; a row opens the file, right-click offers Open With / Reveal.
            - Mermaid diagrams fit the panel width and zoom with Ctrl / ⌘ + wheel or the + / − / 0 keys.
            - `\` closes the side panel and returns to the composer.
            - The side panel opens and closes with the same animation as the sidebar, on desktop and on phones.

            ### Changed

            - The side panel is a full-height card beside the chat, and the title bar, chat and panel share one surface. The panel opens as a preview area: its file list starts hidden and is one click away (the list button, or **Show file list** in an empty panel).
            - File tabs that overflow fade at the edges instead of being cut off, and the tab-strip buttons keep their size in a narrow panel.
            - The terminal and the Scheduled page load when first opened, so the app starts with less code.

            ### Fixed

            - Code blocks keep their background across theme switches.
            - The side-panel button no longer jumps across the title bar while the app loads.
            - Leaving a narrow window width restores the desktop sidebar state.
            - The macOS traffic-light buttons stay on the top bar's centre line after launch and when the window is shown again.
            - Edited-file line counts no longer count unchanged context lines quoted in an edit.
            - A `/skill:` message shows its command inline with the arguments instead of on a separate line, and the title bar shows the typed command.

            ### Good to know

            - The bundled pi is upgraded to 1.2.0: OpenRouter keys list only the models they may use, codemode shows input constraints and run times, and more. MCP servers no longer list their resources at connect, so Settings → MCP → Test reports that a server offers resources instead of counting them.

            Bundled components: pi 1.2.0, pi-web 0.10.0.

            ---

            ## Pi Agent Desktop 0.7.0

            Artifact、内联预览与侧边面板版本。

            ### 新增

            - 侧栏标题栏新增**项目 / 最近**切换：用两个小按钮在项目树和“所有项目会话按最近活动排序的平铺列表”之间切换，选择会被记住。
            - **新会话自动命名**：首轮回复结束后自动生成标题，重新打开的旧会话不会被改名。
            - **会话右键菜单更丰富**：可对列表中任意会话生成标题、复制会话 ID、打开完整历史。
            - **侧边面板中的 Artifact**：助手可以把独立的网页、应用、React 组件、SVG、Mermaid 图或长文档放进单独的面板标签，支持多版本、预览 / 源码切换、复制和下载。要求修改时会原地生成新版本。可在设置 → 常规 →**在侧边面板展示 Artifacts** 中关闭这项提示。
            - **内联预览**：回复中完整的 ```` ```html ```` 页面和 ```` ```svg ```` 图片直接渲染，并可全屏查看。React（`jsx` / `tsx`）组件可按需运行，内置 React 与 Tailwind，不引入 npm 包时离线可用。预览出错时会显示错误，并提供**让模型修复**。
            - 回复下方新增**已修改文件卡片**：列出本轮写入的每个文件及其增删行数；点击打开文件，右键可选择打开方式或在文件夹中显示（macOS 为访达）。
            - Mermaid 图会适配面板宽度，可用 Ctrl / ⌘ + 滚轮或 + / − / 0 键缩放。
            - 按 `\` 关闭侧边面板并回到输入框。
            - 侧边面板的展开和收起与左侧栏使用相同的动画，桌面和手机端均适用。

            ### 变更

            - 侧边面板改为与聊天并排的全高卡片，标题栏、聊天区与面板使用同一底色。面板以预览为主：文件列表默认隐藏，点击列表按钮或空面板中的**显示文件列表**即可打开。
            - 文件标签溢出时在边缘渐隐，不再被截断；面板变窄时标签栏按钮保持原尺寸。
            - 终端和定时任务页面改为首次打开时加载，启动时加载的代码更少。

            ### 修复

            - 切换主题后代码块背景不再丢失。
            - 应用加载时，侧边面板按钮不再在标题栏中跳动。
            - 从窄窗口恢复宽度后，桌面侧边栏状态正确还原。
            - macOS 红绿灯按钮在启动后及窗口重新显示时保持在顶栏中线上。
            - 已修改文件的行数统计不再计入编辑中引用的未改动上下文行。
            - `/skill:` 消息的命令与参数同行显示，标题栏显示你输入的命令。

            ### 需要了解

            - 内置 pi 升级到 1.2.0：OpenRouter key 只列出其可用的模型，codemode 显示输入约束与运行耗时等。MCP 服务器连接时不再列出资源，因此设置 → MCP → 测试改为显示服务器是否提供资源，而不再统计数量。

            内置组件版本：pi 1.2.0、pi-web 0.10.0。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Upload component manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          gh release upload "v$version" src-tauri/resources/component-versions.json --clobber
          gh release edit "v$version" --draft=false --latest

  # A partially failed matrix leaves the release a draft and skips `manifest`,
  # which is correct — but it was also completely silent. Four consecutive
  # v0.1.3 builds failed on Windows without anyone noticing, and the release was
  # published by hand with macOS artifacts only and no component manifest.
  notify:
    needs: [build, manifest]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # This repository currently has Issues disabled, so an issue-only alert
      # silently fails and reports nothing — which is how four consecutive
      # failed releases went unnoticed. The job summary always works; the issue
      # is attempted on top and starts working by itself if Issues are enabled.
      - name: Report the failed release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Signed release build failed"
            echo
            echo "[Run log]($RUN_URL)"
            echo
            echo "The release for this version stays a **draft** and has no"
            echo "\`component-versions.json\`: the manifest job only runs when every"
            echo "platform in the build matrix succeeds."
            echo
            echo "**Do not publish it by hand.** A release missing a platform's installer"
            echo "or its component manifest will not serve updates to that platform —"
            echo "that is exactly how v0.1.3 shipped macOS-only."
          } >> "$GITHUB_STEP_SUMMARY"

          issues_enabled="$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues 2>/dev/null || echo false)"
          if [ "$issues_enabled" != "true" ]; then
            echo "Issues are disabled for $GITHUB_REPOSITORY; reported in the job summary only."
            echo "Enable Issues to also get a persistent, notifying alert." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --label release-failure --limit 1 --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Release build failed again: $RUN_URL"
          else
            gh label create release-failure --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "Signed desktop release build needs attention" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Signed release build failed" \
              --label release-failure \
              --body "The signed desktop release build failed: $RUN_URL

          The release for this version stays a DRAFT and has no component-versions.json,
          because the manifest job only runs when every platform in the build matrix
          succeeds. Do not publish it by hand — a release missing a platform's installer
          or its component manifest will not serve updates to that platform.

          This issue is reused for subsequent failures; close it once a release is green."
          fi
