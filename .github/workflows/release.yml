name: Publish signed desktop release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pi-agent-desktop-release
  cancel-in-progress: false

jobs:
  # tauri-action reuses a draft found by tag and never moves its target or
  # notes, so a draft left by a failed run at an older commit would be
  # published with that commit's tag and notes (v0.7.14). Drop it first.
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Delete a draft left by a run at another commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          node scripts/release-draft.mjs prepare "$GITHUB_REPOSITORY" "v$version" "$GITHUB_SHA"

  build:
    needs: draft
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb
          # Restored after the file-tracer fix in eacaca3/7f2a1c0: a literal
          # homedir() reaching an fs call made @vercel/nft glob the whole
          # Windows profile at build time, which failed on its junction loops.
          # Verified through desktop:prepare by windows-build-debug.yml before
          # re-enabling; Tauri bundling and signing are first exercised here.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Require updater signing secrets
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$UPDATER_PRIVATE_KEY"
          test -n "$UPDATER_PUBLIC_KEY"

      # Developer ID signing and notarization, so a downloaded app opens without
      # macOS asking the user to approve it in System Settings. The identity is
      # read from the imported certificate (APPLE_SIGNING_IDENTITY for both
      # desktop:prepare and Tauri); the notary key goes to a file Tauri reads.
      - name: Import Developer ID certificate and notary key
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY; do
            test -n "${!name}" || { echo "::error::Missing Actions secret $name"; exit 1; }
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)"
          test -n "$identity" || { echo "::error::APPLE_CERTIFICATE holds no valid Developer ID Application identity"; exit 1; }
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          {
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$key_path"
            echo "SIGNING_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"
          echo "Signing as: $identity"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/configure-updater-public-key.mjs

      # The window controls are drawn by the AppKit the binary links, not the
      # one it runs on: an SDK 15 build shows the legacy traffic lights even on
      # macOS 26+, and with different button geometry (0.7.1 shipped from a
      # macOS 15 runner that way). Fail here instead of shipping that again.
      - name: Require the macOS 26 SDK
        if: runner.os == 'macOS'
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk"
          test "${sdk%%.*}" -ge 26

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled component releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run release:manifest
          npm run release:verify

      - name: Prepare packaged Next.js server
        env:
          # A release checkout has no `.pi/` (gitignored), so the payload
          # assertion would pass without being exercised. Plant a fake
          # `.pi/mcp.json` with a canary token and fail the release if it
          # reaches the payload, on every platform.
          PAYLOAD_CANARY: "1"
        run: npm run desktop:prepare

      - name: Test desktop shell
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}

      # On macOS, APPLE_SIGNING_IDENTITY and APPLE_API_* come from the import
      # step: Tauri signs with the imported keychain, notarizes the app and
      # staples the ticket before packing the DMG and updater archive.
      - name: Build, sign, and upload updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PI_AGENT_DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: pi-agent-desktop v__VERSION__
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            ## Pi Agent Desktop 0.7.20

            The main session now has its own Settings tab and is off until you turn it on.

            ### New

            - **Settings › Main session.** One switch turns the whole feature on or off. While it is off, sessions write no close-outs, the main session runs no checks, digests or model turns, and the Main session row, the "Needs you" section and the daily notification are hidden. The main session's model and reasoning level moved here from Settings › General.
            - **Continue work on its own, as a separate switch.** With it off, the main session asks you instead of handing the next step to a task's session itself. Your own replies on a task card still go to that session.
            - **Choose when the main session takes over.** Set how long a session must sit idle before its close-out goes to the main session: 1, 2, 5, 10, 15, 30 or 60 minutes (5 by default).

            ### Changed

            - **The main session and its automatic continue are both off by default**, including on existing installs. Turn them on in Settings › Main session to keep using them.

            ### Fixed

            - **"Chats outside projects" appeared twice** in Settings › General. It now appears once.
            - **Installers are checked for this build machine's configuration.** Packaging now fails if the app's own `.pi/` folder, an MCP access key or a private key would be included (from upstream Pi Agent Desktop).

            Bundled components: pi 1.5.2, pi-web 0.15.0.

            ---

            ## Pi Agent Desktop 0.7.20

            主会话有了自己的设置页，在你打开之前不会运行。

            ### 新增

            - **「设置 › 主会话」。** 一个开关控制整个功能。关闭时，会话不写交接，主会话不做检查、不发摘要、不调用模型，侧栏的「主会话」入口、「需要你」分区和每日通知都会隐藏。主会话的模型和推理强度从「设置 › 常规」移到了这里。
            - **主动续做单独一个开关。** 关闭时，主会话不会自己把下一步交给任务的会话，而是先问你。你在任务卡片上的回复仍会送到那个会话。
            - **可设置主会话多久后接管。** 会话空闲多久后把交接交给主会话：1、2、5、10、15、30 或 60 分钟（默认 5 分钟）。

            ### 变更

            - **主会话和主动续做默认都关闭**，已安装的版本升级后也一样。要继续使用，请在「设置 › 主会话」里打开。

            ### 修复

            - **「设置 › 常规」里「对话（非项目）」出现了两次。** 现在只出现一次。
            - **安装包会检查是否带上了构建机的配置。** 如果会打包进本应用自己的 `.pi/` 文件夹、MCP 访问密钥或私钥，打包直接失败（来自上游 Pi Agent Desktop）。

            内置组件版本：pi 1.5.2、pi-web 0.15.0。

          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      # Tauri signs the DMG but notarizes only the app inside it. Notarize and
      # staple the DMG as well, check both with Gatekeeper the way a downloaded
      # copy is checked, then replace the draft's DMG with the stapled one.
      - name: Notarize the DMG and check Gatekeeper
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          app="$(find "$bundle/macos" -maxdepth 1 -name '*.app' | head -n 1)"
          dmg="$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)"
          test -n "$app" && test -n "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

          result="$(xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --timeout 45m --output-format json)"
          echo "$result"
          status="$(node -p 'JSON.parse(process.argv[1]).status' "$result")"
          if [ "$status" != "Accepted" ]; then
            id="$(node -p 'JSON.parse(process.argv[1]).id' "$result")"
            xcrun notarytool log "$id" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" || true
            echo "::error::DMG notarization finished with status $status"
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"

          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          name="$(gh release view "v$version" --json assets --jq '.assets[].name | select(endswith(".dmg"))' | head -n 1)"
          test -n "$name"
          cp "$dmg" "$RUNNER_TEMP/$name"
          gh release upload "v$version" "$RUNNER_TEMP/$name" --clobber

      - name: Remove signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          rm -f "${APPLE_API_KEY_PATH:-/nonexistent}"

  manifest:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Read the release version
        id: version
        run: echo "version=$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")" >> "$GITHUB_OUTPUT"

      # tauri-action points latest.json at api.github.com asset URLs, which
      # anonymous clients may fetch only 60 times an hour per IP; the updater
      # then fails with "403 Forbidden". Use the public download URLs.
      - name: Point updater downloads at public release URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          dir="$(mktemp -d)"
          gh release download "v$version" --pattern latest.json --dir "$dir"
          gh release view "v$version" --json assets > "$dir/assets.json"
          node scripts/public-updater-urls.mjs "$dir/latest.json" "$dir/assets.json" "$GITHUB_REPOSITORY" "v$version"
          gh release upload "v$version" "$dir/latest.json" --clobber

      - name: Upload component manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          gh release upload "v$version" src-tauri/resources/component-versions.json --clobber
          node scripts/release-draft.mjs check "$GITHUB_REPOSITORY" "v$version" "$GITHUB_SHA"
          # A prerelease is never served by the updater. Say so explicitly
          # instead of relying on the value tauri-action used when it first
          # created the draft (v0.7.3 ended up marked prerelease).
          gh release edit "v$version" --draft=false --latest --prerelease=false

  # Only after the Release is published (manifest), so a draft never gets an image.
  image:
    needs: manifest
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      version: ${{ needs.manifest.outputs.version }}

  # A partially failed matrix leaves the release a draft and skips `manifest`,
  # which is correct — but it was also completely silent. Four consecutive
  # v0.1.3 builds failed on Windows without anyone noticing, and the release was
  # published by hand with macOS artifacts only and no component manifest.
  notify:
    needs: [draft, build, manifest]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # This repository currently has Issues disabled, so an issue-only alert
      # silently fails and reports nothing — which is how four consecutive
      # failed releases went unnoticed. The job summary always works; the issue
      # is attempted on top and starts working by itself if Issues are enabled.
      - name: Report the failed release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Signed release build failed"
            echo
            echo "[Run log]($RUN_URL)"
            echo
            echo "The release for this version stays a **draft** and has no"
            echo "\`component-versions.json\`: the manifest job only runs when every"
            echo "platform in the build matrix succeeds."
            echo
            echo "**Do not publish it by hand.** A release missing a platform's installer"
            echo "or its component manifest will not serve updates to that platform —"
            echo "that is exactly how v0.1.3 shipped macOS-only."
          } >> "$GITHUB_STEP_SUMMARY"

          issues_enabled="$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues 2>/dev/null || echo false)"
          if [ "$issues_enabled" != "true" ]; then
            echo "Issues are disabled for $GITHUB_REPOSITORY; reported in the job summary only."
            echo "Enable Issues to also get a persistent, notifying alert." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --label release-failure --limit 1 --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Release build failed again: $RUN_URL"
          else
            gh label create release-failure --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "Signed desktop release build needs attention" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Signed release build failed" \
              --label release-failure \
              --body "The signed desktop release build failed: $RUN_URL

          The release for this version stays a DRAFT and has no component-versions.json,
          because the manifest job only runs when every platform in the build matrix
          succeeds. Do not publish it by hand — a release missing a platform's installer
          or its component manifest will not serve updates to that platform.

          This issue is reused for subsequent failures; close it once a release is green."
          fi
