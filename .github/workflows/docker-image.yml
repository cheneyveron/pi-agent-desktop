name: Publish server image

# Builds the web server image and pushes it to GitHub Container Registry as
# ghcr.io/cheneyveron/pi-agent-desktop:<version> and :latest. The signed release
# workflow calls this after the Release is published; run it by hand to publish
# (or republish) the image for an existing version tag.
on:
  workflow_call:
    inputs:
      version:
        description: Release version without the leading v, for example 0.7.5
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v, for example 0.7.5
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: pi-agent-desktop-image-${{ inputs.version }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cheneyveron/pi-agent-desktop

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }

      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
