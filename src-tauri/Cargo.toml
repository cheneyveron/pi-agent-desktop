[package]
name = "pi-agent-desktop"
version = "0.7.16"
description = "Desktop shell for Pi Agent"
authors = ["pi-agent-desktop contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "pi_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
dunce = "1"
getrandom = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.10.2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "^2"
tauri-plugin-dialog = "^2"
tauri-plugin-notification = "^2"
# Notifications that report a click (src/shell/notification.rs); the same
# version tauri-plugin-notification already pulls in.
notify-rust = "4.18"
tauri-plugin-process = "^2"
tauri-plugin-updater = "^2"
tauri-plugin-window-state = "^2"

[target.'cfg(windows)'.dependencies]
# A second launch (slow start, repeated icon clicks) must hand over to the
# running instance instead of starting another server on the same ports.
# macOS gets this from LaunchServices and Linux from `ensure_single_instance`.
tauri-plugin-single-instance = "2"
# The main window's WebView2 `ProcessFailed` subscription (shell/webview_recovery.rs).
# Same versions wry already pulls in.
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
# Waits for a click on a notification body, which notify-rust does not on macOS.
mac-notification-sys = "0.6"
# NSVisualEffectView behind the (transparent) webview: the sidebar material.
window-vibrancy = "0.8"
# Re-applies the traffic-light inset after AppKit's own title-bar layout
# (`refresh_traffic_lights` in src/lib.rs). Same versions window-vibrancy
# already pulls in.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Avoid libappindicator's GTK menu bridge, which can render blank labels under GNOME.
ksni = "0.2.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
